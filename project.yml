name: CarplayOS
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 1
targets:
  CarplayOS:
    type: application
    platform: iOS
    sources:
      - path: CarplayOS
    dependencies:
      - target: CarWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.carplayos
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: CarplayOS/Resources/Info.plist
      properties:
        CFBundleName: carplayOS
        CFBundleDisplayName: carplayOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.djsly.carplayos
            CFBundleURLSchemes:
              - carplayos
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
  CarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleName: CarWidgets
        CFBundleDisplayName: carplayOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djsly.carplayos.widgets
        SKIP_INSTALL: true
schemes:
  CarplayOS:
    build:
      targets:
        CarplayOS: all
    run:
      config: Debug
